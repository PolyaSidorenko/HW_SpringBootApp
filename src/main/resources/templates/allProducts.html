<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Все товары</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="container mt-4">

<h1>Список товаров</h1>

<a th:href="@{/products/new}" class="btn btn-primary mb-3">Добавить товар</a>

<table class="table text-center align-middle table-bordered table-striped">
  <thead>
  <tr>
    <th style="width: 10%;">Количество</th>
    <th style="width: 40%;">Название</th>
    <th style="width: 20%;">Цена</th>
    <th style="width: 30%;">Действия</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="product : ${products}">
    <td th:text="${product.quantity}">0</td>
    <td th:text="${product.name}">Название</td>
    <td th:text="${product.price}">0.0</td>
    <td>
      <a th:href="@{/products/edit/{id}(id=${product.id})}" class="btn btn-primary btn-sm">Редактировать</a>
      <a th:href="@{/products/delete/{id}(id=${product.id})}" class="btn btn-danger btn-sm">Удалить</a>
    </td>
  </tr>
  </tbody>
</table>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Редактировать товар</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="container mt-4">
<h1>Редактировать товар</h1>

<form th:action="@{/products/update}" th:object="${product}" method="post">
  <input type="hidden" th:field="*{id}" />

  <div class="mb-3">
    <label for="name" class="form-label">Название:</label>
    <input type="text" th:field="*{name}" id="name" class="form-control" required/>
  </div>

  <div class="mb-3">
    <label for="price" class="form-label">Цена:</label>
    <input type="number" step="0.01" th:field="*{price}" id="price" class="form-control" required/>
  </div>

  <div class="mb-3">
    <label for="quantity" class="form-label">Количество:</label>
    <input type="number" th:field="*{quantity}" id="quantity" class="form-control" required/>
  </div>

  <button type="submit" class="btn btn-success">Сохранить</button>
  <a th:href="@{/products}" class="btn btn-secondary">Отмена</a>
</form>
</body>
</html>
